<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Student Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Smart Student Portal</h1>
    <p>Interactive Academic & Utility Dashboard</p>
  </header>

  <main class="container">
    <!-- Task 1: Student Registration Form -->
    <section class="card" id="task1">
      <h2>Task 1: Student Registration</h2>
      <form id="registrationForm" novalidate>
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="e.g., Jane Doe">
        </div>
        <div class="form-group">
          <label for="studentId">Student ID</label>
          <input type="text" id="studentId" placeholder="e.g., ST-1002">
        </div>
        <div class="form-group">
          <label for="age">Age</label>
          <input type="number" id="age" placeholder="Min 16">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="jane@example.com">
        </div>
        <div class="form-group">
          <label for="track">Track Selection</label>
          <select id="track">
            <option value="">-- Select Track --</option>
            <option value="Frontend">Frontend</option>
            <option value="Backend">Backend</option>
            <option value="Mobile Development">Mobile Development</option>
          </select>
        </div>
        <button type="submit" class="btn">Register Student</button>
      </form>
      <div id="regOutput" class="message-box"></div>
    </section>

    <!-- Task 2: Grade Calculator -->
    <section class="card" id="task2">
      <h2>Task 2: Grade Calculator</h2>
      <form id="gradeForm">
        <div class="form-group">
          <label for="mark1">Subject 1 Mark (0-100)</label>
          <input type="number" id="mark1" min="0" max="100" placeholder="0 - 100">
        </div>
        <div class="form-group">
          <label for="mark2">Subject 2 Mark (0-100)</label>
          <input type="number" id="mark2" min="0" max="100" placeholder="0 - 100">
        </div>
        <div class="form-group">
          <label for="mark3">Subject 3 Mark (0-100)</label>
          <input type="number" id="mark3" min="0" max="100" placeholder="0 - 100">
        </div>
        <button type="submit" class="btn">Calculate Grade</button>
      </form>
      <div id="gradeOutput" class="message-box"></div>
    </section>

    <!-- Task 3: Smart Discount Calculator -->
    <section class="card" id="task3">
      <h2>Task 3: Smart Discount Calculator</h2>
      <form id="discountForm">
        <div class="form-group">
          <label for="productName">Product Name</label>
          <input type="text" id="productName" placeholder="e.g., Laptop">
        </div>
        <div class="form-group">
          <label for="productPrice">Product Price (EGP)</label>
          <input type="number" id="productPrice" step="0.01" placeholder="e.g., 500">
        </div>
        <div class="form-group">
          <label for="productQty">Quantity</label>
          <input type="number" id="productQty" min="1" placeholder="Min 1">
        </div>
        <div class="form-group">
          <label for="discountPct">Discount Percentage (%)</label>
          <input type="number" id="discountPct" min="0" max="100" placeholder="0 - 100">
        </div>
        <button type="submit" class="btn">Calculate Discount</button>
      </form>
      <div id="discountOutput" class="message-box"></div>
    </section>

    <!-- Task 4: Interactive Counter -->
    <section class="card" id="task4">
      <h2>Task 4: Interactive Counter</h2>
      <div class="counter-display" id="counterValue">0</div>
      <div class="btn-group">
        <button id="btnInc" class="btn btn-action">+</button>
        <button id="btnDec" class="btn btn-action">-</button>
        <button id="btnReset" class="btn btn-secondary">Reset</button>
      </div>
      <div id="counterMsg" class="message-box active info"></div>
    </section>

    <!-- Task 5: Temperature Converter -->
    <section class="card" id="task5">
      <h2>Task 5: Temperature Converter</h2>
      <div class="form-group">
        <label for="tempInput">Temperature Input</label>
        <input type="number" id="tempInput" step="any" placeholder="Enter numerical degree">
      </div>
      <div class="btn-group">
        <button id="btnCtoF" class="btn">Celsius to Fahrenheit</button>
        <button id="btnFtoC" class="btn btn-secondary">Fahrenheit to Celsius</button>
      </div>
      <div id="tempOutput" class="message-box"></div>
    </section>

    <!-- Task 6: Mini Quiz Application -->
    <section class="card full-width" id="task6">
      <h2>Task 6: Mini Quiz Application</h2>
      <form id="quizForm">
        <div id="quizContainer"></div>
        <button type="submit" class="btn">Submit Quiz</button>
      </form>
      <div id="quizOutput" class="message-box"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
